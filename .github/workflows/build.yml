# psc-kernel-payload CI: the kernel-flasher payload (boot.img + abrootfs.tgz) from source on a GitHub-hosted
# runner - the kernel (sources/psc-kernel, a submodule) with the console's gcc-6 from the autobleem-build
# image, the userland with Buildroot. Buildroot refuses to run as root, so this is not a container job: it
# builds docker/Dockerfile (autobleem-kernel-build, on top of ghcr.io/autobleem2/autobleem-build) and runs
# docker/run.sh, which runs as the runner's uid. Buildroot's downloads and ccache persist across runs in the
# Actions cache (a cold build compiles Buildroot's toolchain and every package; a warm one mostly hits).
# Gated by AB_CI_ENABLED.
name: build

on:
  push:
    branches: [develop, master]
    tags: ['v*']
  pull_request:
    branches: [develop, master]
  workflow_dispatch:
    inputs:
      variants:
        description: variants to build (space separated; psc next)
        type: string
        default: 'psc'
      force_build:
        description: build even when nothing changed since the last release (which is otherwise reused)
        type: boolean
        default: false

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    if: vars.AB_CI_ENABLED == 'true'
    runs-on: ubuntu-24.04
    outputs:
      variants: ${{ steps.p.outputs.json }}
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - id: p
        run: |
          p="${{ inputs.variants }}"; [ -n "$p" ] || p="psc"
          echo "json=$(printf '%s\n' $p | jq -R . | jq -cs .)" >> "$GITHUB_OUTPUT"
      - id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else echo "version=$(date -u +%Y%m%d)-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"; fi

  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(needs.plan.outputs.variants) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      VARIANT: ${{ matrix.variant }}
      AB_KERNEL_IMAGE: autobleem-kernel-build
      # an absolute path outside the checkout - actions/cache refuses '..' ("Relative pathing '.' and '..' is
      # not allowed"), which silently kept the first run's cache from being saved
      AB_KERNEL_CACHE: /home/runner/kcache
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0   # the tags, for the reuse check below
      # The payload changes rarely and a cold build is ~50 min: when nothing that goes into it changed since
      # the newest release carrying this variant's payload (anything but docs - configs, board files, scripts,
      # the kernel submodule's pin, this workflow), that release's payload is taken as this build's, under this
      # version. A release exists only after a build passed verify.sh's safety check, so only a verified
      # payload is ever reused. force_build (dispatch) builds regardless. Assets are listed by release id:
      # GitHub's tag view can go on missing an asset uploaded after publishing.
      - name: Reuse the last release's payload when nothing changed
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          V="${{ needs.plan.outputs.version }}"; VAR="${{ matrix.variant }}"
          echo "hit=false" >> "$GITHUB_OUTPUT"
          if [ "${{ inputs.force_build }}" = true ]; then echo "force_build: building"; exit 0; fi
          while IFS=$'\t' read -r id tag; do
            [ "$tag" = "$GITHUB_REF_NAME" ] && continue   # this very tag's release is what this run makes
            aids="$(gh api "repos/$GITHUB_REPOSITORY/releases/$id/assets" --paginate \
                     --jq ".[] | select(.name | startswith(\"kernel-payload-$VAR-\")) | .id")"
            aid="${aids%%$'\n'*}"
            [ -n "$aid" ] || continue
            if ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then echo "no tag $tag here - building"; exit 0; fi
            changed="$(git diff --name-only "$tag" HEAD -- . ':(exclude)*.md' ':(exclude)docs/**' ':(exclude)LICENSE')"
            if [ -n "$changed" ]; then
              echo "changed since $tag - building:"; echo "$changed" | sed 's/^/  /'; exit 0
            fi
            mkdir -p out
            gh api -H 'Accept: application/octet-stream' "repos/$GITHUB_REPOSITORY/releases/assets/$aid" \
              > "out/kernel-payload-$VAR-$V.tar.gz"
            tar -tzf "out/kernel-payload-$VAR-$V.tar.gz" kernel/boot.img kernel/abrootfs.tgz >/dev/null
            echo "nothing changed since $tag: its payload reused as kernel-payload-$VAR-$V.tar.gz"
            echo "hit=true" >> "$GITHUB_OUTPUT"
            exit 0
          done < <(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq '.[] | select(.draft|not) | "\(.id)\t\(.tag_name)"')
          echo "no earlier release with a $VAR payload - building"
      - name: Free disk space (Buildroot's output runs to several GB)
        if: steps.reuse.outputs.hit != 'true'
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      # restore and save as two steps: the save right after the build, whatever verify says - a combined
      # actions/cache saves only when the whole job succeeds, and a failed safety check must not cost the
      # next run its warm cache. Downloads, Buildroot's ccache and the kernel's ccache (docker/run.sh).
      - name: Restore Buildroot downloads + ccache
        id: kcache
        if: steps.reuse.outputs.hit != 'true'
        uses: actions/cache/restore@v6
        with:
          path: /home/runner/kcache
          key: kernel-${{ matrix.variant }}-${{ hashFiles('configs/**', 'board/psc/linux_autobleem_config') }}-${{ github.sha }}
          restore-keys: |
            kernel-${{ matrix.variant }}-${{ hashFiles('configs/**', 'board/psc/linux_autobleem_config') }}-
            kernel-${{ matrix.variant }}-
      - name: Build the image (autobleem-kernel-build)
        if: steps.reuse.outputs.hit != 'true'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker build -t autobleem-kernel-build \
            --build-arg BASE=ghcr.io/autobleem2/autobleem-build:latest -f docker/Dockerfile docker
      - name: Build the payload (${{ matrix.variant }})
        if: steps.reuse.outputs.hit != 'true'
        run: docker/run.sh scripts/build.sh -V "${{ matrix.variant }}" all
      - name: Cache sizes
        if: always() && steps.reuse.outputs.hit != 'true'
        run: du -sh /home/runner/kcache/* 2>/dev/null || true
      - name: Save Buildroot downloads + ccache
        if: always() && steps.reuse.outputs.hit != 'true' && steps.kcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: /home/runner/kcache
          key: kernel-${{ matrix.variant }}-${{ hashFiles('configs/**', 'board/psc/linux_autobleem_config') }}-${{ github.sha }}
      - name: Verify against the shipped payload
        if: steps.reuse.outputs.hit != 'true'
        run: docker/run.sh scripts/build.sh -V "${{ matrix.variant }}" verify
      - name: Package
        if: steps.reuse.outputs.hit != 'true'
        run: |
          set -euo pipefail
          docker/run.sh scripts/build.sh -V "${{ matrix.variant }}" payload
          V="${{ needs.plan.outputs.version }}"
          mkdir -p out
          tar -czf "out/kernel-payload-${{ matrix.variant }}-$V.tar.gz" -C "payload/${{ matrix.variant }}" kernel
          ls -l out payload/${{ matrix.variant }}/kernel
      - uses: actions/upload-artifact@v7
        with:
          name: kernel-payload-${{ matrix.variant }}
          path: out/*.tar.gz
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [plan, build]
    runs-on: ubuntu-24.04
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v8
        with: { pattern: kernel-payload-*, path: out, merge-multiple: true }
      - name: Attach to the release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          prerelease=""; case "${GITHUB_REF_NAME}" in *-*) prerelease="--prerelease";; esac
          gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" \
            --title "PSC kernel payload ${GITHUB_REF_NAME}" --generate-notes $prerelease out/*.tar.gz || \
          gh release upload "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" out/*.tar.gz --clobber
