# Overrides systemd's /usr/lib/tmpfiles.d/tmp.conf (same name): /tmp without the 10-day age limit.
# The console has no battery clock - it boots at 2018-09-01, and once dhcpcd's hook (lib/dhcpcd/dhcpcd-hooks/
# 70-autobleem-time) sets the real time, everything made in /tmp since boot looks eight years old. The daily
# systemd-tmpfiles-clean.timer (first run 15 min after boot) then deleted it: on 2026-09-26 it emptied most of
# /tmp/lib - the launcher's SDL2 links and the ogg/vorbis libraries - and ABFlashKit no longer started
# ("undefined symbol: Mix_LoadWAV", Sony's SDL_mixer 2.0.1 found instead). /tmp is RAM and empties at every
# boot anyway. /var/tmp keeps systemd's own rule.
q /tmp 1777 root root -
